name = "nfl-loser-pickem"
main = "src/index.ts"
compatibility_date = "2024-11-01"
compatibility_flags = ["nodejs_compat"]

# Workers configuration
workers_dev = true
account_id = "" # Add your Cloudflare account ID here

# D1 Database binding
[[d1_databases]]
binding = "DB"
database_name = "nfl-loser-pickem-db"
database_id = "" # Will be created with: wrangler d1 create nfl-loser-pickem-db
migrations_dir = "migrations"

# KV namespace for caching (optional - for ESPN API responses, etc.)
# Uncomment and add IDs after creating with: wrangler kv:namespace create CACHE
# [[kv_namespaces]]
# binding = "CACHE"
# id = "your-kv-namespace-id"
# preview_id = "your-preview-kv-namespace-id"

# R2 bucket for backups (optional - for season/standings backups)
# Uncomment after creating with: wrangler r2 bucket create nfl-loser-pickem-backups
# [[r2_buckets]]
# binding = "BACKUPS"
# bucket_name = "nfl-loser-pickem-backups"
# preview_bucket_name = "nfl-loser-pickem-backups-preview"

# Environment variables
[vars]
ENVIRONMENT = "production"
LOG_LEVEL = "info"

# Secrets (set with: wrangler secret put SECRET_NAME)
# 
# DISCORD (if using Discord):
#   DISCORD_TOKEN - Discord bot token
#   DISCORD_PUBLIC_KEY - Discord application public key
#   DISCORD_APPLICATION_ID - Discord application ID
#
# SLACK (if using Slack):
#   SLACK_BOT_TOKEN - Slack Bot User OAuth Token (xoxb-...)
#   SLACK_SIGNING_SECRET - Slack app signing secret
#
# OPTIONAL:
#   ESPN_API_KEY - (optional) if ESPN requires authentication
#   THESPORTSDB_API_KEY - (optional) if using TheSportsDB provider

# Cron triggers for scheduled tasks
# Note: Cloudflare Workers has specific cron syntax requirements
# Be careful with wildcard usage - not all combinations are supported

[triggers]
crons = [
  "0 * * * *"          # Every hour (game score updates)
  # Note: More frequent polling disabled for now due to Cloudflare cron limitations
  # Enable these after deployment if needed via dashboard
  # "0,15,30,45 * * * 0",      # Every 15 min on Sunday
  # "0,15,30,45 18-23 * * 1",  # Every 15 min Mon evening
  # "0,15,30,45 18-23 * * 4"   # Every 15 min Thu evening
]

# Development environment overrides
[env.dev]
name = "nfl-loser-pickem-dev"
vars = { ENVIRONMENT = "development", LOG_LEVEL = "debug" }

[[env.dev.d1_databases]]
binding = "DB"
database_name = "nfl-loser-pickem-db-dev"
database_id = "" # Separate dev database

# Uncomment KV/R2 if using in dev
# [[env.dev.kv_namespaces]]
# binding = "CACHE"
# id = "" # Dev KV namespace
#
# [[env.dev.r2_buckets]]
# binding = "BACKUPS"
# bucket_name = "nfl-loser-pickem-backups-dev"

# Build configuration
[build]
command = "npm run build"

# Observability
[observability]
enabled = true
