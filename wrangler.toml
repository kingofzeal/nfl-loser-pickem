name = "nfl-loser-pickem"
main = "src/index.ts"
compatibility_date = "2024-11-01"
node_compat = true

# Workers configuration
workers_dev = true
account_id = "" # Add your Cloudflare account ID here

# D1 Database binding
[[d1_databases]]
binding = "DB"
database_name = "nfl-loser-pickem-db"
database_id = "" # Will be created with: wrangler d1 create nfl-loser-pickem-db
migrations_dir = "migrations"

# KV namespace for caching (optional - for ESPN API responses, etc.)
[[kv_namespaces]]
binding = "CACHE"
id = "" # Will be created with: wrangler kv:namespace create CACHE
preview_id = "" # For preview deployments

# R2 bucket for backups (optional - for season/standings backups)
[[r2_buckets]]
binding = "BACKUPS"
bucket_name = "nfl-loser-pickem-backups"
preview_bucket_name = "nfl-loser-pickem-backups-preview"

# Environment variables
[vars]
ENVIRONMENT = "production"
LOG_LEVEL = "info"

# Secrets (set with: wrangler secret put SECRET_NAME)
# DISCORD_TOKEN - Discord bot token
# DISCORD_PUBLIC_KEY - Discord application public key
# DISCORD_APPLICATION_ID - Discord application ID
# ESPN_API_KEY - (optional) if ESPN requires authentication

# Cron triggers for scheduled tasks
[[triggers.crons]]
# Every Tuesday at 5 AM EST (10 AM UTC during standard time, 9 AM UTC during DST)
# Adjust based on when week locks typically happen
cron = "0 9 * * TUE"

[[triggers.crons]]
# Every Monday at 11 PM EST (4 AM UTC Tuesday) - post-week processing
# For updating standings after Monday Night Football
cron = "0 4 * * TUE"

# Development environment overrides
[env.dev]
name = "nfl-loser-pickem-dev"
vars = { ENVIRONMENT = "development", LOG_LEVEL = "debug" }

[[env.dev.d1_databases]]
binding = "DB"
database_name = "nfl-loser-pickem-db-dev"
database_id = "" # Separate dev database

[[env.dev.kv_namespaces]]
binding = "CACHE"
id = "" # Dev KV namespace

[[env.dev.r2_buckets]]
binding = "BACKUPS"
bucket_name = "nfl-loser-pickem-backups-dev"

# Build configuration
[build]
command = "npm run build"

[build.upload]
format = "service-worker"

# Observability
[observability]
enabled = true
