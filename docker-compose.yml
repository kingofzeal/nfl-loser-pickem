version: '3.8'

services:
  postgres:
    image: postgres:14-alpine
    environment:
      POSTGRES_DB: nfl_pickem
      POSTGRES_USER: pickem
      POSTGRES_PASSWORD: changeme
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pickem"]
      interval: 10s
      timeout: 5s
      retries: 5

  bot:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://pickem:changeme@postgres:5432/nfl_pickem
      SLACK_BOT_TOKEN: ${SLACK_BOT_TOKEN}
      SLACK_SIGNING_SECRET: ${SLACK_SIGNING_SECRET}
      DISCORD_BOT_TOKEN: ${DISCORD_BOT_TOKEN}
      DATA_SOURCE: espn
      ENABLE_SCHEDULER: "true"
      NODE_ENV: production
    ports:
      - "3000:3000"
    restart: unless-stopped
    volumes:
      - ./public/images:/app/public/images

volumes:
  postgres_data:
